		{
			"camo"
		};
		class Animations
		{
			class arc_rotate
			{
				type="rotation";
				source="arc_rotate";
				selection="arc_rotate";
				axis="arc_rotate_axis";
				minValue = 0.0;
				maxValue = 1.0;
				angle0 = 0.0;
				angle1 = -1.9;
				memory = true;
			};
			class wires
			{
				type="hide";
				source="arc_rotate";
				selection="wires";
				minValue = 0.0;
				maxValue = 1.0;
				hideValue = 0.01;
			};
			class left_arm
			{
				type="rotation";
				source="arc_rotate";
				selection="larm";
				axis="larm_axis";
				minValue = 0.0;
				maxValue = 1.0;
				angle0 = 0.0;
				angle1 = -0.1;
				memory = true;
			};
			class right_arm
			{
				type="rotation";
				source="arc_rotate";
				selection="rarm";
				axis="rarm_axis";
				minValue = 0.0;
				maxValue = 1.0;
				angle0 = 0.0;
				angle1 = 0.1;
				memory = true;
			};
			class left_cup
			{
				type="rotation";
				source="arc_rotate";
				selection="lcup";
				axis="lcup_axis";
				minValue = 0.0;
				maxValue = 1.0;
				angle0 = 0.0;
				angle1 = -0.3;
				memory = true;
			};
			class right_cup
